<title>ORAK Universe — inicio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
@font-face{ font-family:'Cinzel'; src:local('Cinzel'); }
:root{
  --bg-top:#0c0f14;
  --bg-low:#080a0d;
  --gold:#caa876;
  --gold-dim:rgba(202,168,118,0.6);
  --card:rgba(255,255,255,0.045);
  --card-border:rgba(255,255,255,0.09);
  --ink:#f3f1ec;
  --fog:rgba(243,241,236,0.5);
  --icon-size:52px;
  --cols:4;
}
:root[data-theme="light"]{
  --bg-top:#f4f1ea;
  --bg-low:#e8e2d5;
  --gold:#a97d42;
  --gold-dim:rgba(169,125,66,0.65);
  --card:rgba(20,15,10,0.045);
  --card-border:rgba(20,15,10,0.12);
  --ink:#241c14;
  --fog:rgba(36,28,20,0.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;padding:0;height:100%;overflow:hidden;
  background:var(--bg-low);
  font-family:'Crimson Pro',Georgia,serif;
  color:var(--ink);
  touch-action:none;
  overscroll-behavior:none;
}
.bg{
  position:fixed;inset:0;
  background:
    linear-gradient(180deg, rgba(8,10,13,0.15), rgba(8,10,13,0.55) 70%, rgba(8,10,13,0.85)),
    url('wallpaper.jpg') center center / cover no-repeat,
    linear-gradient(180deg, var(--bg-top), var(--bg-low));
}
:root[data-theme="light"] .bg{
  background:
    linear-gradient(180deg, rgba(244,241,234,0.55), rgba(232,226,213,0.78) 70%, rgba(232,226,213,0.92)),
    url('wallpaper.jpg') center center / cover no-repeat,
    linear-gradient(180deg, var(--bg-top), var(--bg-low));
}
.wrap{
  position:fixed;inset:0;
  padding:calc(22px + env(safe-area-inset-top)) 22px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
  gap:14px;
}
.icon-svg{width:18px;height:18px;display:block;}

.hdr{display:flex;justify-content:space-between;align-items:flex-start;}
.hide-greet .greet{visibility:hidden;}
.greet .h1{font-size:1.5rem;color:var(--ink);}
.greet .h2{
  font-family:'JetBrains Mono',monospace;font-size:0.68rem;
  color:var(--fog);margin-top:4px;line-height:1.5;
}
.greet .underline{width:28px;height:1px;background:rgba(255,255,255,0.22);margin-top:14px;}

/* El logo de Orak: el mismo anillo con un punto que ya usamos para la luna,
   pero girando despacio y sin parar — toca para abrir ORAK Universe,
   mantén presionado para los ajustes del launcher. */
.ring-btn{
  flex:none;width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(202,168,118,0.4);
  background:none;position:relative;
}
.ring-btn::after{
  content:'';position:absolute;width:5px;height:5px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 6px 1px rgba(202,168,118,0.7);
  left:50%;top:0;margin:-2.5px 0 0 -2.5px;
  transform-origin:2.5px 21.5px;
  animation:orbit 6s linear infinite;
}
.ring-btn:active{background:rgba(255,255,255,0.06);}

.defaultbar{
  display:none;
  align-items:center;justify-content:space-between;gap:10px;
  padding:9px 8px 9px 14px;
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:20px;
  flex:none;
}
.defaultbar.show{display:flex;}
.defaultbar span{
  font-family:'JetBrains Mono',monospace;font-size:0.56rem;color:var(--fog);
  line-height:1.3;
}
.defaultbar button{
  flex:none;border:none;border-radius:14px;cursor:pointer;
  padding:7px 12px;
  background:#c9a876;color:#1a1310;
  font-family:'JetBrains Mono',monospace;font-size:0.54rem;letter-spacing:0.02em;
  white-space:nowrap;
}

.carousel{flex:1;min-height:0;overflow:hidden;position:relative;}
.carousel-track{
  display:flex;height:100%;
  transition:transform 0.32s cubic-bezier(.2,.8,.2,1);
}
.no-anim .carousel-track{transition:none;}
.cpage{
  flex:0 0 100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;
}

.orbit-wrap{position:relative;width:min(46vw, 180px);aspect-ratio:1;}
.orbit-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(202,168,118,0.16);}
.orbit-ring.r2{inset:-16px;border-color:rgba(202,168,118,0.09);}
.orbit-dot{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 8px 2px rgba(202,168,118,0.7);
  left:50%;top:-16px;margin:-2.5px 0 0 -2.5px;
  transform-origin:2.5px calc(50% + 16px);
  animation:orbit 40s linear infinite;
}
@keyframes orbit{ to{ transform:rotate(360deg); } }
.no-anim .orbit-dot, .no-anim .ring-btn::after{animation:none;}
#moonCanvas{position:absolute;inset:14%;border-radius:50%;}

.wpage .wicon{color:var(--gold);}
.wpage .wtemp{font-size:2.6rem;color:var(--ink);margin-top:6px;}
.wpage .wcond{
  font-family:'JetBrains Mono',monospace;font-size:0.62rem;letter-spacing:0.04em;
  color:var(--fog);text-transform:uppercase;
}

.epage .eglyph{
  width:52px;height:52px;border-radius:14px;
  background:rgba(202,168,118,0.12);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);
}
.epage .elbl{
  font-family:'JetBrains Mono',monospace;font-size:0.52rem;letter-spacing:0.08em;
  color:var(--gold-dim);text-transform:uppercase;margin-top:10px;
}
.epage .ettl{font-size:1.15rem;color:var(--ink);margin-top:4px;}
.epage .esub{
  font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--fog);margin-top:4px;
}

.apage .aorb{
  width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(255,236,205,0.95), rgba(202,168,118,0.3) 65%);
  box-shadow:0 0 18px 3px rgba(202,168,118,0.4);
}
.apage .attl{font-size:1.1rem;color:var(--ink);margin-top:8px;}
.askbar{
  display:flex;align-items:center;gap:10px;
  padding:11px 9px 11px 15px;
  width:min(280px, 78vw);
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:24px;
  margin-top:6px;
}
.askbar input{
  flex:1;background:none;border:none;outline:none;
  font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--ink);
}
.askbar input::placeholder{color:rgba(243,241,236,0.35);}
.askbar .orb{
  flex:none;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(255,236,205,0.95), rgba(202,168,118,0.3) 65%);
  box-shadow:0 0 12px 2px rgba(202,168,118,0.4);
  border:none;
}

.dots{display:flex;justify-content:center;gap:7px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.18);transition:background 0.2s ease, transform 0.2s ease;}
.dot.active{background:var(--gold);transform:scale(1.3);}

.hide-datebar .datebar{visibility:hidden;}
.datebar{
  display:flex;align-items:center;justify-content:center;gap:18px;
  flex:none;
}
.datebar .dcol .dname{font-family:'JetBrains Mono',monospace;font-size:0.54rem;letter-spacing:0.12em;color:var(--gold-dim);}
.datebar .dcol .dnum{font-size:1.7rem;color:var(--ink);line-height:1.15;}
.datebar .dcol .dmonth{font-family:'JetBrains Mono',monospace;font-size:0.5rem;letter-spacing:0.12em;color:var(--fog);}
.datebar .divider{width:1px;height:36px;background:rgba(255,255,255,0.12);}
.datebar .wcol{display:flex;align-items:center;gap:7px;}
.datebar .wcol .wtemp2{font-size:1.15rem;color:var(--ink);}
.datebar .wcol .wcond2{font-family:'JetBrains Mono',monospace;font-size:0.5rem;color:var(--fog);display:block;margin-top:1px;}

.quick{flex:none;width:100%;}
.quick .lbl{
  font-family:'JetBrains Mono',monospace;font-size:0.56rem;letter-spacing:0.08em;
  color:var(--fog);text-align:center;margin-bottom:9px;
}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-height:calc(var(--icon-size) + 24px);}
.qbtn{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  background:none;border:none;color:var(--ink);
}
.qbtn .box{
  width:var(--icon-size);height:var(--icon-size);border-radius:15px;
  background:var(--card);
  border:1px solid var(--card-border);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);
  overflow:hidden;
  transition:transform 0.12s ease, background 0.12s ease;
}
.qbtn .box img{width:100%;height:100%;object-fit:cover;}
.qbtn:active .box{transform:scale(0.93);background:rgba(255,255,255,0.09);}
.qbtn.dragging{opacity:0.35;}
.hide-labels .qlabel, .hide-labels .alabel{display:none;}
.qbtn .qlabel{font-family:'JetBrains Mono',monospace;font-size:0.53rem;color:var(--fog);}
.favorites-empty{
  grid-column:1/-1;
  font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:var(--fog);
  text-align:center;padding:10px 6px;line-height:1.6;
}

.chevron-btn{
  flex:none;align-self:center;
  width:36px;height:24px;
  display:flex;align-items:center;justify-content:center;
  color:rgba(243,241,236,0.4);
  background:none;border:none;
}

.toast{
  position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(10px);
  background:rgba(10,12,16,0.92);
  border:1px solid var(--card-border);
  color:var(--fog);
  font-family:'JetBrains Mono',monospace;font-size:0.6rem;
  padding:9px 16px;border-radius:20px;
  opacity:0;pointer-events:none;
  transition:opacity 0.2s ease, transform 0.2s ease;
  z-index:20;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Paneles que suben desde abajo — el cajón de apps y los ajustes comparten
   el mismo tratamiento visual, para que se sientan del mismo sistema. */
.apps-panel{
  position:fixed;inset:0;z-index:30;
  background:rgba(8,10,13,0.9);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;
  transform:translateY(100%);
  transition:transform 0.3s cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="light"] .apps-panel{background:rgba(232,226,213,0.94);}
.no-anim .apps-panel{transition:none;}
.apps-panel.open{transform:translateY(0);}
.apps-hdr{display:flex;align-items:center;justify-content:space-between;flex:none;}
.apps-title{font-size:1.1rem;color:var(--ink);}
.apps-close{
  width:32px;height:32px;border-radius:50%;
  border:1px solid var(--card-border);background:none;color:var(--fog);
  display:flex;align-items:center;justify-content:center;
}
.apps-search{flex:none;}
.apps-search input{
  width:100%;padding:10px 14px;
  background:var(--card);border:1px solid var(--card-border);border-radius:20px;
  font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--ink);
  outline:none;
}
.apps-search input::placeholder{color:rgba(243,241,236,0.35);}
.apps-grid{
  flex:1;overflow-y:auto;
  display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:16px 8px;
  align-content:start;
  padding-bottom:20px;
}
.app-cell{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:none;border:none;color:var(--ink);
}
.app-cell.dragging{opacity:0.4;}
.app-cell .aicon{
  width:var(--icon-size);height:var(--icon-size);border-radius:14px;
  background:var(--card);border:1px solid var(--card-border);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.app-cell .aicon img{width:100%;height:100%;object-fit:cover;}
.app-cell .aicon .fav-dot{
  position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 4px 1px rgba(202,168,118,0.7);
}
.app-cell .alabel{
  font-family:'JetBrains Mono',monospace;font-size:0.5rem;color:var(--fog);
  text-align:center;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.apps-empty{
  font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:var(--fog);
  text-align:center;margin-top:40px;
}

.settings-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 2px;border-bottom:1px solid rgba(255,255,255,0.06);
  font-family:'JetBrains Mono',monospace;font-size:0.64rem;color:var(--ink);
}
.setting-row input[type="checkbox"]{
  -webkit-appearance:none;appearance:none;
  width:36px;height:20px;border-radius:12px;position:relative;
  background:rgba(255,255,255,0.14);outline:none;cursor:pointer;
  transition:background 0.15s ease;flex:none;
}
.setting-row input[type="checkbox"]::before{
  content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--fog);transition:transform 0.15s ease, background 0.15s ease;
}
.setting-row input[type="checkbox"]:checked{background:rgba(202,168,118,0.45);}
.setting-row input[type="checkbox"]:checked::before{transform:translateX(16px);background:var(--gold);}
.seg{display:flex;gap:5px;flex:none;}
.seg button{
  border:1px solid var(--card-border);background:none;color:var(--fog);
  border-radius:8px;padding:5px 11px;font-family:'JetBrains Mono',monospace;font-size:0.6rem;
}
.seg button.active{background:rgba(202,168,118,0.18);color:var(--gold);border-color:rgba(202,168,118,0.4);}

/* Menú corto que aparece al mantener presionada una app en el cajón. */
.ctx-menu{
  position:fixed;z-index:40;
  background:rgba(16,12,9,0.96);
  border:1px solid var(--card-border);
  border-radius:12px;
  padding:6px;
  display:flex;flex-direction:column;
  min-width:170px;
  opacity:0;pointer-events:none;
  transform:translateY(4px);
  transition:opacity 0.14s ease, transform 0.14s ease;
}
.ctx-menu.show{opacity:1;pointer-events:auto;transform:translateY(0);}
.ctx-menu button{
  background:none;border:none;color:var(--ink);text-align:left;
  padding:10px 12px;border-radius:8px;
  font-family:'JetBrains Mono',monospace;font-size:0.62rem;
}
.ctx-menu button:active{background:rgba(255,255,255,0.08);}
</style>

<script>
// Saludo + fecha reales — mismo lenguaje que el resto de orakOS: nada
// decorativo que no refleje algo cierto (la hora de verdad, el día de verdad).
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function tick(){
  const now = new Date();
  const h = now.getHours();
  const saludo = h < 12 ? 'Buen día' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  document.getElementById('greetLine').textContent = `${saludo}, Jack.`;
  document.getElementById('dayName').textContent = DIAS[now.getDay()];
  document.getElementById('dayNum').textContent = now.getDate();
  document.getElementById('monthName').textContent = MESES[now.getMonth()];
}
tick();
setInterval(tick, 60000);

// La luna: fase simple, iluminada desde un lado, quieta salvo el punto que
// orbita despacio (ya en CSS) — vivo pero sin ruido, como el resto de la casa.
const moonCv = document.getElementById('moonCanvas');
const mctx = moonCv.getContext('2d');
function fitMoon(){
  const r = moonCv.getBoundingClientRect();
  if(!r.width) return;
  moonCv.width = r.width; moonCv.height = r.height;
  drawMoon();
}
function drawMoon(){
  const w = moonCv.width, h = moonCv.height;
  if(!w || !h) return;
  mctx.clearRect(0,0,w,h);
  const cx = w/2, cy = h/2, r = Math.min(w,h)/2;
  const base = mctx.createRadialGradient(cx-r*0.3, cy-r*0.3, r*0.1, cx, cy, r);
  base.addColorStop(0, '#3a3a3e');
  base.addColorStop(1, '#101013');
  mctx.beginPath();
  mctx.arc(cx, cy, r, 0, Math.PI*2);
  mctx.fillStyle = base;
  mctx.fill();
  const rim = mctx.createRadialGradient(cx+r*0.55, cy, 0, cx+r*0.55, cy, r*0.9);
  rim.addColorStop(0, 'rgba(255,224,170,0.9)');
  rim.addColorStop(0.5, 'rgba(202,168,118,0.25)');
  rim.addColorStop(1, 'rgba(202,168,118,0)');
  mctx.globalCompositeOperation = 'lighter';
  mctx.beginPath();
  mctx.arc(cx, cy, r, 0, Math.PI*2);
  mctx.fillStyle = rim;
  mctx.fill();
  mctx.globalCompositeOperation = 'source-over';
}

// ── Puente nativo: si esto corre dentro de la app de Android de verdad
// (Capacitor con nuestro plugin OrakLauncher registrado), estas funciones
// existen y hacen cosas reales — listar apps, abrirlas, abrir el navegador,
// el marcador, la cámara, una URL, y avisar cuando se instala/quita algo.
// Si no (probando en un navegador normal), caen todas a un aviso honesto
// en vez de fingir. ─────────────────────────────────────────────────────
function orak(){ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.OrakLauncher; }

// Avisa (una barra chica, no un modal) si orakOS todavía no es el launcher
// permanente del sistema — y vuelve a revisar cada vez que regresas a la
// app, para que la barra desaparezca sola cuando ya quedó puesto de verdad.
const defaultBar = document.getElementById('defaultBar');
async function checkDefaultLauncher(){
  const bridge = orak();
  if(!bridge || !bridge.isDefaultLauncher) return;
  try {
    const res = await bridge.isDefaultLauncher();
    defaultBar.classList.toggle('show', !res.isDefault);
  } catch(e) { /* si falla la revisión, no molestamos con la barra */ }
}
document.getElementById('defaultBtn').addEventListener('click', () => {
  const bridge = orak();
  if(bridge && bridge.requestDefaultLauncher) bridge.requestDefaultLauncher();
  else showToast('esto se activa instalado en el teléfono');
});
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkDefaultLauncher(); });
checkDefaultLauncher();

// ═══════════════════════════════════════════════════════════════════════
// Apps reales: se piden una vez al abrir la app (no solo cuando se abre el
// cajón), para que los favoritos ya tengan ícono/nombre real desde el
// primer segundo. Se vuelven a pedir solas cuando Android avisa que algo
// se instaló/desinstaló/actualizó (evento 'appsChanged').
// ═══════════════════════════════════════════════════════════════════════
const MOCK_APPS = [
  { packageName:'mock.whatsapp', label:'WhatsApp' },
  { packageName:'mock.chrome', label:'Chrome' },
  { packageName:'mock.camara', label:'Cámara' },
  { packageName:'mock.fotos', label:'Fotos' },
  { packageName:'mock.ajustes', label:'Ajustes' },
  { packageName:'mock.musica', label:'Música' },
];

let ALL_APPS = [];
let appsReady = false;

async function loadAllApps(){
  const bridge = orak();
  if(bridge){
    try {
      const res = await bridge.listApps();
      ALL_APPS = res.apps || [];
      appsReady = true;
      return ALL_APPS;
    } catch(e) { /* cae a la lista de muestra */ }
  }
  ALL_APPS = MOCK_APPS;
  appsReady = true;
  return ALL_APPS;
}
function findApp(pkg){ return ALL_APPS.find(a => a.packageName === pkg); }

function launchOrToast(pkg){
  const bridge = orak();
  if(bridge) bridge.launchApp({ packageName: pkg }).catch(() => showToast('no pude abrir esa app'));
  else showToast('solo funciona instalado en el teléfono');
}

// ── Favoritos: se guardan como lista de package names en el propio
// teléfono (localStorage de la app). Nada codificado a mano — si están
// vacíos, se sugiere ir al cajón a elegir. ────────────────────────────
const FAV_KEY = 'orak-favorites';
function getFavorites(){
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(e){ return []; }
}
function setFavorites(list){ localStorage.setItem(FAV_KEY, JSON.stringify(list)); }
function isFavorite(pkg){ return getFavorites().includes(pkg); }
function toggleFavorite(pkg){
  let favs = getFavorites();
  if(favs.includes(pkg)) favs = favs.filter(p => p !== pkg);
  else favs.push(pkg);
  setFavorites(favs);
  renderFavorites();
}

const favoritesGrid = document.getElementById('favoritesGrid');
function renderFavorites(){
  const favs = getFavorites();
  if(!favs.length){
    favoritesGrid.innerHTML = `<div class="favorites-empty">mantén presionada una app en el cajón para agregarla aquí</div>`;
    return;
  }
  favoritesGrid.innerHTML = favs.map(pkg => {
    const app = findApp(pkg);
    const label = app ? app.label : pkg;
    const icon = app && app.icon ? `<img src="${app.icon}">` : '▢';
    return `<button class="qbtn" data-pkg="${pkg}"><span class="box">${icon}</span><span class="qlabel">${label}</span></button>`;
  }).join('');
  favoritesGrid.querySelectorAll('.qbtn').forEach(btn => wireFavoriteCell(btn));
}

// Tocar abre la app. Mantener presionado sin arrastrar quita de favoritos
// (con confirmación corta vía menú). Arrastrar reordena en vivo.
function wireFavoriteCell(btn){
  let pressTimer = null, longPressed = false, dragging = false;
  let startX = 0;
  btn.addEventListener('touchstart', e => {
    longPressed = false; dragging = false;
    startX = e.touches[0].clientX;
    pressTimer = setTimeout(() => {
      longPressed = true;
      showCtxMenu(e.touches[0].clientX, e.touches[0].clientY, [
        { label:'Quitar de favoritos', action: () => toggleFavorite(btn.dataset.pkg) },
      ]);
    }, 450);
  }, {passive:true});
  btn.addEventListener('touchmove', e => {
    if(Math.abs(e.touches[0].clientX - startX) > 12){
      clearTimeout(pressTimer);
      if(!dragging && !longPressed){ dragging = true; btn.classList.add('dragging'); }
    }
    if(dragging){
      const x = e.touches[0].clientX, y = e.touches[0].clientY;
      const under = document.elementFromPoint(x, y);
      const otherBtn = under && under.closest('.qbtn');
      if(otherBtn && otherBtn !== btn && otherBtn.parentElement === favoritesGrid){
        const favs = getFavorites();
        const from = favs.indexOf(btn.dataset.pkg);
        const to = favs.indexOf(otherBtn.dataset.pkg);
        if(from !== -1 && to !== -1){
          favs.splice(to, 0, favs.splice(from, 1)[0]);
          setFavorites(favs);
          renderFavorites();
        }
      }
    }
  }, {passive:true});
  btn.addEventListener('touchend', () => {
    clearTimeout(pressTimer);
    if(dragging){ btn.classList.remove('dragging'); return; }
    if(!longPressed) launchOrToast(btn.dataset.pkg);
  });
}

// ── Menú contextual chico (mantener presionado en el cajón / favoritos) ──
const ctxMenu = document.getElementById('ctxMenu');
function showCtxMenu(x, y, items){
  ctxMenu.innerHTML = items.map((it,i) => `<button data-i="${i}">${it.label}</button>`).join('');
  ctxMenu.querySelectorAll('button').forEach((b,i) => {
    b.addEventListener('click', () => { items[i].action(); hideCtxMenu(); });
  });
  const w = 180, h = items.length * 40 + 12;
  const left = Math.min(window.innerWidth - w - 10, Math.max(10, x - w/2));
  const top = Math.min(window.innerHeight - h - 10, y - 10);
  ctxMenu.style.left = left + 'px';
  ctxMenu.style.top = top + 'px';
  ctxMenu.classList.add('show');
}
function hideCtxMenu(){ ctxMenu.classList.remove('show'); }
document.addEventListener('touchstart', e => {
  if(!e.target.closest('.ctx-menu')) hideCtxMenu();
}, {passive:true});

// ── Cajón de apps: sube desde abajo, muestra TODAS las apps reales
// (orden alfabético), con buscador (nombre o package name), y mantener
// presionada una la agrega/quita de favoritos. ───────────────────────────
const appsPanel = document.getElementById('appsPanel');
const appsGrid = document.getElementById('appsGrid');
const appsSearchInput = document.getElementById('appsSearchInput');

function renderAppsGrid(list){
  if(!list.length){
    appsGrid.innerHTML = `<div class="apps-empty">no encontré apps</div>`;
    return;
  }
  const sorted = list.slice().sort((a,b) => a.label.localeCompare(b.label, 'es'));
  appsGrid.innerHTML = sorted.map(app => `
    <button class="app-cell" data-pkg="${app.packageName}">
      <span class="aicon">${app.icon ? `<img src="${app.icon}">` : '▢'}${isFavorite(app.packageName) ? '<span class="fav-dot"></span>' : ''}</span>
      <span class="alabel">${app.label}</span>
    </button>`).join('');
  appsGrid.querySelectorAll('.app-cell').forEach(cell => {
    let pressTimer = null, longPressed = false;
    cell.addEventListener('touchstart', e => {
      longPressed = false;
      const pkg = cell.dataset.pkg;
      pressTimer = setTimeout(() => {
        longPressed = true;
        const fav = isFavorite(pkg);
        showCtxMenu(e.touches[0].clientX, e.touches[0].clientY, [
          { label: fav ? 'Quitar de favoritos' : 'Agregar a favoritos', action: () => {
              toggleFavorite(pkg);
              renderAppsGrid(currentAppsFilter());
              showToast(fav ? 'quitado de favoritos' : 'agregado a favoritos');
            } },
        ]);
      }, 450);
    }, {passive:true});
    cell.addEventListener('touchend', () => {
      clearTimeout(pressTimer);
      if(!longPressed) launchOrToast(cell.dataset.pkg);
    });
  });
}
function currentAppsFilter(){
  const q = appsSearchInput.value.trim().toLowerCase();
  if(!q) return ALL_APPS;
  return ALL_APPS.filter(a => a.label.toLowerCase().includes(q) || a.packageName.toLowerCase().includes(q));
}
appsSearchInput.addEventListener('input', () => renderAppsGrid(currentAppsFilter()));
appsSearchInput.addEventListener('mousedown', e => e.stopPropagation());
appsSearchInput.addEventListener('touchstart', e => e.stopPropagation());

async function openAppsPanel(){
  appsPanel.classList.add('open');
  if(!appsReady) await loadAllApps();
  appsSearchInput.value = '';
  renderAppsGrid(ALL_APPS);
}
function closeAppsPanel(){ appsPanel.classList.remove('open'); }
document.getElementById('chevronBtn').addEventListener('click', openAppsPanel);
document.getElementById('appsClose').addEventListener('click', closeAppsPanel);

// ── Ajustes: todo se guarda y se vuelve a aplicar solo al abrir la app. ──
const SETTINGS_KEY = 'orak-settings';
const DEFAULT_SETTINGS = {
  greet:true, datebar:true, labels:true, anim:true, light:false, iconSize:52, cols:4,
};
function getSettings(){
  try { return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(localStorage.getItem(SETTINGS_KEY))); }
  catch(e){ return Object.assign({}, DEFAULT_SETTINGS); }
}
function setSettings(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); applySettings(s); }
function applySettings(s){
  document.body.classList.toggle('hide-greet', !s.greet);
  document.body.classList.toggle('hide-datebar', !s.datebar);
  document.body.classList.toggle('hide-labels', !s.labels);
  document.body.classList.toggle('no-anim', !s.anim);
  document.documentElement.setAttribute('data-theme', s.light ? 'light' : 'dark');
  document.documentElement.style.setProperty('--icon-size', s.iconSize + 'px');
  document.documentElement.style.setProperty('--cols', s.cols);
}
function renderSettingsUI(){
  const s = getSettings();
  document.getElementById('setGreet').checked = s.greet;
  document.getElementById('setDatebar').checked = s.datebar;
  document.getElementById('setLabels').checked = s.labels;
  document.getElementById('setAnim').checked = s.anim;
  document.getElementById('setLight').checked = s.light;
  document.querySelectorAll('#setIconSize button').forEach(b => b.classList.toggle('active', Number(b.dataset.v) === s.iconSize));
  document.querySelectorAll('#setCols button').forEach(b => b.classList.toggle('active', Number(b.dataset.v) === s.cols));
}
['setGreet','setDatebar','setLabels','setAnim','setLight'].forEach(id => {
  document.getElementById(id).addEventListener('change', e => {
    const s = getSettings();
    const key = { setGreet:'greet', setDatebar:'datebar', setLabels:'labels', setAnim:'anim', setLight:'light' }[id];
    s[key] = e.target.checked;
    setSettings(s);
  });
});
document.querySelectorAll('#setIconSize button').forEach(b => {
  b.addEventListener('click', () => { const s = getSettings(); s.iconSize = Number(b.dataset.v); setSettings(s); renderSettingsUI(); });
});
document.querySelectorAll('#setCols button').forEach(b => {
  b.addEventListener('click', () => { const s = getSettings(); s.cols = Number(b.dataset.v); setSettings(s); renderSettingsUI(); });
});
applySettings(getSettings());

const settingsPanel = document.getElementById('settingsPanel');
function openSettingsPanel(){ renderSettingsUI(); settingsPanel.classList.add('open'); }
function closeSettingsPanel(){ settingsPanel.classList.remove('open'); }
document.getElementById('settingsClose').addEventListener('click', closeSettingsPanel);

// ── Arranque: carga las apps reales ya, para que favoritos/cajón estén
// listos, y escucha instalar/desinstalar/actualizar para refrescarse sola.
// El addListener se difiere un tick: llamarlo en la misma pasada síncrona
// en que carga la página puede pasarle al puente nativo antes de que
// termine de armarse (visto en el teléfono real: "Cannot read properties
// of undefined (reading 'triggerEvent')") — esperar un tick le da tiempo. ──
loadAllApps().then(() => renderFavorites());
setTimeout(() => {
  const bridgeAtStart = orak();
  if(bridgeAtStart && bridgeAtStart.addListener){
    bridgeAtStart.addListener('appsChanged', async () => {
      await loadAllApps();
      // limpia favoritos de apps que ya no existen (se desinstalaron)
      const stillInstalled = new Set(ALL_APPS.map(a => a.packageName));
      const favs = getFavorites().filter(p => stillInstalled.has(p));
      setFavorites(favs);
      renderFavorites();
      if(appsPanel.classList.contains('open')) renderAppsGrid(currentAppsFilter());
    });
  }
}, 0);

// ── Carrusel de la luna/clima/evento/Orak AI — cuatro páginas que se
// deslizan horizontal, con los puntos abajo marcando en cuál estás ──────
const carouselEl = document.getElementById('carousel');
const trackEl = document.getElementById('carouselTrack');
const dotEls = document.querySelectorAll('.dot');
const PAGE_COUNT = 4;
let pageIndex = 0;
function renderPage(){
  trackEl.style.transform = `translateX(${-pageIndex*100}%)`;
  dotEls.forEach((d,i) => d.classList.toggle('active', i === pageIndex));
}
let cStartX = 0, cDeltaX = 0, cDragging = false;
carouselEl.addEventListener('touchstart', e => {
  if(e.target.closest('input')) return;
  cStartX = e.touches[0].clientX;
  cDragging = true;
  trackEl.style.transition = 'none';
}, {passive:true});
carouselEl.addEventListener('touchmove', e => {
  if(!cDragging || !e.touches.length) return;
  cDeltaX = e.touches[0].clientX - cStartX;
  trackEl.style.transform = `translateX(calc(${-pageIndex*100}% + ${cDeltaX}px))`;
}, {passive:true});
carouselEl.addEventListener('touchend', () => {
  if(!cDragging) return;
  cDragging = false;
  trackEl.style.transition = 'transform 0.32s cubic-bezier(.2,.8,.2,1)';
  if(cDeltaX < -50 && pageIndex < PAGE_COUNT-1) pageIndex++;
  else if(cDeltaX > 50 && pageIndex > 0) pageIndex--;
  cDeltaX = 0;
  renderPage();
});

// Deslizar hacia arriba desde el cuerpo de la pantalla abre el panel de tus
// apps reales — mismo destino que el botón de flecha, para quien prefiera
// el gesto. Solo cuenta si EMPIEZA cerca de abajo y recorre bastante
// distancia, para no dispararse con un toque cualquiera.
let swipeStartY = 0, swipeTracking = false, swipeMoved = false;
document.addEventListener('touchstart', e => {
  if(e.target.closest('input') || e.target.closest('.carousel') || e.target.closest('.apps-panel')) return;
  const y = e.touches[0].clientY;
  swipeTracking = y > window.innerHeight * 0.8;
  swipeStartY = y;
  swipeMoved = false;
}, {passive:true});
document.addEventListener('touchmove', e => {
  if(!swipeTracking || !e.touches.length) return;
  const dy = e.touches[0].clientY - swipeStartY;
  if(dy < -130) swipeMoved = true;
}, {passive:true});
document.addEventListener('touchend', () => {
  if(swipeTracking && swipeMoved) openAppsPanel();
  swipeTracking = false;
});
</script>
