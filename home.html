<title>ORAK Universe — inicio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
@font-face{ font-family:'Cinzel'; src:local('Cinzel'); }
:root{
  --bg-top:#0c0f14;
  --bg-low:#080a0d;
  --gold:#caa876;
  --gold-dim:rgba(202,168,118,0.6);
  --card:rgba(255,255,255,0.045);
  --card-border:rgba(255,255,255,0.09);
  --ink:#f3f1ec;
  --fog:rgba(243,241,236,0.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;padding:0;height:100%;overflow:hidden;
  background:var(--bg-low);
  font-family:'Crimson Pro',Georgia,serif;
  color:var(--ink);
  touch-action:none;
  overscroll-behavior:none;
}
.bg{
  position:fixed;inset:0;
  background:
    radial-gradient(120% 60% at 50% -6%, rgba(202,168,118,0.08), transparent 60%),
    linear-gradient(180deg, var(--bg-top), var(--bg-low));
}
.wrap{
  position:fixed;inset:0;
  padding:calc(22px + env(safe-area-inset-top)) 22px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
  gap:14px;
}
.icon-svg{width:18px;height:18px;display:block;}

.hdr{display:flex;justify-content:space-between;align-items:flex-start;}
.greet .h1{font-size:1.5rem;color:var(--ink);}
.greet .h2{
  font-family:'JetBrains Mono',monospace;font-size:0.68rem;
  color:var(--fog);margin-top:4px;line-height:1.5;
}
.greet .underline{width:28px;height:1px;background:rgba(255,255,255,0.22);margin-top:14px;}

.ring-btn{
  flex:none;width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(202,168,118,0.4);
  background:none;position:relative;
}
.ring-btn::after{
  content:'';position:absolute;width:5px;height:5px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 6px 1px rgba(202,168,118,0.7);
  top:1px;right:6px;
}
.ring-btn:active{background:rgba(255,255,255,0.06);}

.carousel{flex:1;min-height:0;overflow:hidden;position:relative;}
.carousel-track{
  display:flex;height:100%;
  transition:transform 0.32s cubic-bezier(.2,.8,.2,1);
}
.cpage{
  flex:0 0 100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;
}

.orbit-wrap{position:relative;width:min(46vw, 180px);aspect-ratio:1;}
.orbit-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(202,168,118,0.16);}
.orbit-ring.r2{inset:-16px;border-color:rgba(202,168,118,0.09);}
.orbit-dot{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 8px 2px rgba(202,168,118,0.7);
  left:50%;top:-16px;margin:-2.5px 0 0 -2.5px;
  transform-origin:2.5px calc(50% + 16px);
  animation:orbit 40s linear infinite;
}
@keyframes orbit{ to{ transform:rotate(360deg); } }
#moonCanvas{position:absolute;inset:14%;border-radius:50%;}

.wpage .wicon{color:var(--gold);}
.wpage .wtemp{font-size:2.6rem;color:var(--ink);margin-top:6px;}
.wpage .wcond{
  font-family:'JetBrains Mono',monospace;font-size:0.62rem;letter-spacing:0.04em;
  color:var(--fog);text-transform:uppercase;
}

.epage .eglyph{
  width:52px;height:52px;border-radius:14px;
  background:rgba(202,168,118,0.12);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);
}
.epage .elbl{
  font-family:'JetBrains Mono',monospace;font-size:0.52rem;letter-spacing:0.08em;
  color:var(--gold-dim);text-transform:uppercase;margin-top:10px;
}
.epage .ettl{font-size:1.15rem;color:var(--ink);margin-top:4px;}
.epage .esub{
  font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--fog);margin-top:4px;
}

.apage .aorb{
  width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(255,236,205,0.95), rgba(202,168,118,0.3) 65%);
  box-shadow:0 0 18px 3px rgba(202,168,118,0.4);
}
.apage .attl{font-size:1.1rem;color:var(--ink);margin-top:8px;}
.askbar{
  display:flex;align-items:center;gap:10px;
  padding:11px 9px 11px 15px;
  width:min(280px, 78vw);
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:24px;
  margin-top:6px;
}
.askbar input{
  flex:1;background:none;border:none;outline:none;
  font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--ink);
}
.askbar input::placeholder{color:rgba(243,241,236,0.35);}
.askbar .orb{
  flex:none;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(255,236,205,0.95), rgba(202,168,118,0.3) 65%);
  box-shadow:0 0 12px 2px rgba(202,168,118,0.4);
  border:none;
}

.dots{display:flex;justify-content:center;gap:7px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.18);transition:background 0.2s ease, transform 0.2s ease;}
.dot.active{background:var(--gold);transform:scale(1.3);}

.datebar{
  display:flex;align-items:center;justify-content:center;gap:18px;
  flex:none;
}
.datebar .dcol .dname{font-family:'JetBrains Mono',monospace;font-size:0.54rem;letter-spacing:0.12em;color:var(--gold-dim);}
.datebar .dcol .dnum{font-size:1.7rem;color:var(--ink);line-height:1.15;}
.datebar .dcol .dmonth{font-family:'JetBrains Mono',monospace;font-size:0.5rem;letter-spacing:0.12em;color:var(--fog);}
.datebar .divider{width:1px;height:36px;background:rgba(255,255,255,0.12);}
.datebar .wcol{display:flex;align-items:center;gap:7px;}
.datebar .wcol .wtemp2{font-size:1.15rem;color:var(--ink);}
.datebar .wcol .wcond2{font-family:'JetBrains Mono',monospace;font-size:0.5rem;color:var(--fog);display:block;margin-top:1px;}

.quick{flex:none;width:100%;}
.quick .lbl{
  font-family:'JetBrains Mono',monospace;font-size:0.56rem;letter-spacing:0.08em;
  color:var(--fog);text-align:center;margin-bottom:9px;
}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.qbtn{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  background:none;border:none;color:var(--ink);
}
.qbtn .box{
  width:52px;height:52px;border-radius:15px;
  background:var(--card);
  border:1px solid var(--card-border);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);
  transition:transform 0.12s ease, background 0.12s ease;
}
.qbtn:active .box{transform:scale(0.93);background:rgba(255,255,255,0.09);}
.qbtn .qlabel{font-family:'JetBrains Mono',monospace;font-size:0.53rem;color:var(--fog);}

.chevron-btn{
  flex:none;align-self:center;
  width:36px;height:24px;
  display:flex;align-items:center;justify-content:center;
  color:rgba(243,241,236,0.4);
  background:none;border:none;
}

.toast{
  position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(10px);
  background:rgba(10,12,16,0.92);
  border:1px solid var(--card-border);
  color:var(--fog);
  font-family:'JetBrains Mono',monospace;font-size:0.6rem;
  padding:9px 16px;border-radius:20px;
  opacity:0;pointer-events:none;
  transition:opacity 0.2s ease, transform 0.2s ease;
  z-index:20;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

<div class="bg"></div>
<div class="wrap">
  <div class="hdr">
    <div class="greet">
      <div class="h1" id="greetLine">Buen día, Jack.</div>
      <div class="h2">Todo listo para crear hoy.</div>
      <div class="underline"></div>
    </div>
    <button class="ring-btn" id="ringBtn"></button>
  </div>

  <div class="carousel" id="carousel">
    <div class="carousel-track" id="carouselTrack">
      <div class="cpage">
        <div class="orbit-wrap">
          <div class="orbit-ring r2"></div>
          <div class="orbit-ring"></div>
          <div class="orbit-dot"></div>
          <canvas id="moonCanvas"></canvas>
        </div>
      </div>
      <div class="cpage wpage">
        <svg class="wicon" style="width:44px;height:44px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 17h10a3.5 3.5 0 0 0 .5-6.96A5 5 0 0 0 8 8.2 3.5 3.5 0 0 0 7 17Z"/></svg>
        <div class="wtemp">26°</div>
        <div class="wcond">Nublado · Jueves</div>
      </div>
      <div class="cpage epage">
        <div class="eglyph"><svg class="icon-svg" style="width:24px;height:24px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 9.5h16M8 3.5v3M16 3.5v3"/></svg></div>
        <div class="elbl">próximo evento</div>
        <div class="ettl">Escritura colectiva</div>
        <div class="esub">20:00 — Capítulo 5</div>
      </div>
      <div class="cpage apage">
        <div class="aorb"></div>
        <div class="attl">Orak AI</div>
        <div class="askbar">
          <input type="text" id="askInput" placeholder="Pregúntale a Orak…" autocomplete="off" spellcheck="false">
          <button class="orb" id="askOrb"></button>
        </div>
      </div>
    </div>
  </div>
  <div class="dots" id="dots">
    <span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>

  <div class="datebar">
    <div class="dcol">
      <div class="dname" id="dayName">--</div>
      <div class="dnum" id="dayNum">--</div>
      <div class="dmonth" id="monthName">---</div>
    </div>
    <div class="divider"></div>
    <div class="wcol">
      <svg class="icon-svg" style="color:var(--fog);width:20px;height:20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 17h10a3.5 3.5 0 0 0 .5-6.96A5 5 0 0 0 8 8.2 3.5 3.5 0 0 0 7 17Z"/></svg>
      <div>
        <div class="wtemp2">26°</div>
        <span class="wcond2">Nublado</span>

    </div>

  <div class="quick">
    <div class="lbl">ACCESOS RÁPIDOS</div>
    <div class="quick-grid">
      <button class="qbtn" data-tip="mensajes">
        <span class="box"><svg class="icon-svg" style="width:22px;height:22px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7A2.5 2.5 0 0 1 17.5 16H10l-4.5 3.5V16H6.5A2.5 2.5 0 0 1 4 13.5v-7Z"/><circle cx="9" cy="10" r="0.9" fill="currentColor" stroke="none"/><circle cx="12" cy="10" r="0.9" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="0.9" fill="currentColor" stroke="none"/></svg></span><span class="qlabel">Mensajes</span>
      </button>
      <button class="qbtn" data-tip="telefono">
        <span class="box"><svg class="icon-svg" style="width:20px;height:20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1v3.4c0 .6-.4 1-1 1C10.6 21 3 13.4 3 3.9c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8Z"/></svg></span><span class="qlabel">Teléfono</span>
      </button>
      <button class="qbtn" data-tip="explorar">
        <span class="box"><svg class="icon-svg" style="width:24px;height:24px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="10" ry="3.2" transform="rotate(-18 12 12)"/></svg></span><span class="qlabel">Explorar</span>
      </button>
      <button class="qbtn" data-tip="camara">

  <button class="chevron-btn" id="chevronBtn">

  </button>
</div>

<div class="toast" id="toast"></div>

<script>
// Saludo + fecha reales — mismo lenguaje que el resto de orakOS: nada
// decorativo que no refleje algo cierto (la hora de verdad, el día de verdad).
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function tick(){
  const now = new Date();
  const h = now.getHours();
  const saludo = h < 12 ? 'Buen día' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  document.getElementById('greetLine').textContent = `${saludo}, Jack.`;
  document.getElementById('dayName').textContent = DIAS[now.getDay()];
  document.getElementById('dayNum').textContent = now.getDate();
  document.getElementById('monthName').textContent = MESES[now.getMonth()];
}
tick();
setInterval(tick, 60000);

// La luna: fase simple, iluminada desde un lado, quieta salvo el punto que
// orbita despacio (ya en CSS) — vivo pero sin ruido, como el resto de la casa.
const moonCv = document.getElementById('moonCanvas');
const mctx = moonCv.getContext('2d');
function fitMoon(){
  const r = moonCv.getBoundingClientRect();
  if(!r.width) return;
  moonCv.width = r.width; moonCv.height = r.height;
  drawMoon();
}
function drawMoon(){
  const w = moonCv.width, h = moonCv.height;
  if(!w || !h) return;
  mctx.clearRect(0,0,w,h);
  const cx = w/2, cy = h/2, r = Math.min(w,h)/2;
  const base = mctx.createRadialGradient(cx-r*0.3, cy-r*0.3, r*0.1, cx, cy, r);
  base.addColorStop(0, '#3a3a3e');
  base.addColorStop(1, '#101013');
  mctx.beginPath();
  mctx.arc(cx, cy, r, 0, Math.PI*2);
  mctx.fillStyle = base;
  mctx.fill();
  const rim = mctx.createRadialGradient(cx+r*0.55, cy, 0, cx+r*0.55, cy, r*0.9);
  rim.addColorStop(0, 'rgba(255,224,170,0.9)');
  rim.addColorStop(0.5, 'rgba(202,168,118,0.25)');
  rim.addColorStop(1, 'rgba(202,168,118,0)');
  mctx.globalCompositeOperation = 'lighter';
  mctx.beginPath();
  mctx.arc(cx, cy, r, 0, Math.PI*2);
  mctx.fillStyle = rim;
  mctx.fill();
  mctx.globalCompositeOperation = 'source-over';
}
window.addEventListener('resize', fitMoon);
requestAnimationFrame(fitMoon);

// Toast liviano para todo lo que todavía no está conectado de verdad.
const toastEl = document.getElementById('toast');
let toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

document.getElementById('ringBtn').addEventListener('click', () => showToast('ajustes — próximamente'));
document.querySelectorAll('.qbtn').forEach(btn => {
  btn.addEventListener('click', () => showToast('próximamente'));
});
function askSubmit(){
  const input = document.getElementById('askInput');
  if(!input.value.trim()) return;
  showToast('Vela todavía no puede responder aquí — pronto');
  input.value = '';
}
document.getElementById('askOrb').addEventListener('click', askSubmit);
document.getElementById('askInput').addEventListener('keydown', e => { if(e.key === 'Enter') askSubmit(); });
document.getElementById('askInput').addEventListener('mousedown', e => e.stopPropagation());
document.getElementById('askInput').addEventListener('touchstart', e => e.stopPropagation());

// El botón de flecha, igual que deslizar arriba, abre la escalera con todas
// tus apps reales — el "launcher" completo que ya construimos.
document.getElementById('chevronBtn').addEventListener('click', () => {
  window.location.href = 'launcher.html';
});

// ── Carrusel de la luna/clima/evento/Orak AI — cuatro páginas que se
// deslizan horizontal, con los puntos abajo marcando en cuál estás ──────
const carouselEl = document.getElementById('carousel');
const trackEl = document.getElementById('carouselTrack');
const dotEls = document.querySelectorAll('.dot');
const PAGE_COUNT = 4;
let pageIndex = 0;
function renderPage(){
  trackEl.style.transform = `translateX(${-pageIndex*100}%)`;
  dotEls.forEach((d,i) => d.classList.toggle('active', i === pageIndex));
}
let cStartX = 0, cDeltaX = 0, cDragging = false;
carouselEl.addEventListener('touchstart', e => {
  if(e.target.closest('input')) return;
  cStartX = e.touches[0].clientX;
  cDragging = true;
  trackEl.style.transition = 'none';
}, {passive:true});
carouselEl.addEventListener('touchmove', e => {
  if(!cDragging || !e.touches.length) return;
  cDeltaX = e.touches[0].clientX - cStartX;
  trackEl.style.transform = `translateX(calc(${-pageIndex*100}% + ${cDeltaX}px))`;
}, {passive:true});
carouselEl.addEventListener('touchend', () => {
  if(!cDragging) return;
  cDragging = false;
  trackEl.style.transition = 'transform 0.32s cubic-bezier(.2,.8,.2,1)';
  if(cDeltaX < -50 && pageIndex < PAGE_COUNT-1) pageIndex++;
  else if(cDeltaX > 50 && pageIndex > 0) pageIndex--;
  cDeltaX = 0;
  renderPage();
});

// Deslizar hacia arriba desde el cuerpo de la pantalla abre la escalera con
// todas tus apps reales — mismo destino que el botón de flecha, para quien
// prefiera el gesto. Solo cuenta si EMPIEZA cerca de abajo y recorre
// bastante distancia, para no dispararse con un toque cualquiera.
let swipeStartY = 0, swipeTracking = false, swipeMoved = false;
document.addEventListener('touchstart', e => {
  if(e.target.closest('input') || e.target.closest('.carousel')) return;
  const y = e.touches[0].clientY;
  swipeTracking = y > window.innerHeight * 0.8;
  swipeStartY = y;
  swipeMoved = false;
}, {passive:true});
document.addEventListener('touchmove', e => {
  if(!swipeTracking || !e.touches.length) return;
  const dy = e.touches[0].clientY - swipeStartY;
  if(dy < -130) swipeMoved = true;
}, {passive:true});
document.addEventListener('touchend', () => {
  if(swipeTracking && swipeMoved) window.location.href = 'launcher.html';
  swipeTracking = false;
});
</script>
